name: Publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows release
        run: npm run dist -- --publish never
      - name: Publish GitHub release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $version --notes "CrewDeck $version"
          }
          Copy-Item "dist/CrewDeck Setup $version.exe" "dist/CrewDeck-Setup-$version.exe"
          Copy-Item "dist/CrewDeck Setup $version.exe.blockmap" "dist/CrewDeck-Setup-$version.exe.blockmap"
          $assetNames = @(gh release view $tag --json assets --jq '.assets[].name')
          $obsoleteNames = @(
            "CptSpaceDust.Community.Setup.$version.exe",
            "CptSpaceDust.Community.Setup.$version.exe.blockmap",
            "CptSpaceDust.Community.$version.exe",
            "CptSpaceDust-Community-$version.exe",
            "CrewDeck.Setup.$version.exe",
            "CrewDeck.Setup.$version.exe.blockmap"
          )
          foreach ($assetName in $obsoleteNames) {
            if ($assetNames -contains $assetName) {
              gh release delete-asset $tag $assetName --yes
            }
          }
          gh release upload $tag `
            "dist/CrewDeck-Setup-$version.exe" `
            "dist/CrewDeck-Setup-$version.exe.blockmap" `
            "dist/latest.yml" `
            --clobber

          # Keep the release GitHub resolves for this tag and remove any duplicate
          # release records left behind by older concurrent publishing jobs.
          $keeperId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
          $sameTagReleases = @(
            gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
              ConvertFrom-Json |
              Where-Object { $_.tag_name -eq $tag }
          )
          foreach ($release in $sameTagReleases) {
            if ([string]$release.id -ne [string]$keeperId) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            }
          }
