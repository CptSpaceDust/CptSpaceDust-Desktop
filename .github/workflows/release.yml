name: Publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows release
        run: npm run dist -- --publish never
      - name: Publish GitHub release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $version --notes "CptSpaceDust Desktop $version"
          }
          Copy-Item "dist/CptSpaceDust Community Setup $version.exe" "dist/CptSpaceDust-Community-Setup-$version.exe"
          Copy-Item "dist/CptSpaceDust Community Setup $version.exe.blockmap" "dist/CptSpaceDust-Community-Setup-$version.exe.blockmap"
          Copy-Item "dist/CptSpaceDust Community $version.exe" "dist/CptSpaceDust-Community-$version.exe"
          $assetNames = @(gh release view $tag --json assets --jq '.assets[].name')
          $legacyNames = @(
            "CptSpaceDust.Community.Setup.$version.exe",
            "CptSpaceDust.Community.Setup.$version.exe.blockmap",
            "CptSpaceDust.Community.$version.exe"
          )
          foreach ($assetName in $legacyNames) {
            if ($assetNames -contains $assetName) {
              gh release delete-asset $tag $assetName --yes
            }
          }
          gh release upload $tag `
            "dist/CptSpaceDust-Community-Setup-$version.exe" `
            "dist/CptSpaceDust-Community-Setup-$version.exe.blockmap" `
            "dist/CptSpaceDust-Community-$version.exe" `
            "dist/latest.yml" `
            --clobber
